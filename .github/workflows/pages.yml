# Publishes site/ (homepage + privacy policy) to https://rumman999.github.io/doku-scan/
# One-time: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Website

# Every push to main republishes the site (it's tiny), plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
